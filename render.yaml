services:
  - type: web
    name: quantum-bridge
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: QUANTUM_WORKER_DISABLED
        value: "0"
      - key: QUANTUM_WORKER_INTERVAL_MS
        value: "30000"
      - key: IRIS_API
        value: https://iris-api-sandbox.circle.com
      - key: CORS_ORIGIN
        value: https://quantum-bridge.onrender.com
